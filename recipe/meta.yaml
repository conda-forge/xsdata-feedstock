{% set name = "xsdata" %}
{% set version = "26.10" %}

package:
  name: {{ name|lower }}
  version: "{{ version }}"

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 4bc944d9fa3955f84ecebb83c677e2f681687c002a777731a21104e8360a7522

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv
  entry_points:
    - xsdata = xsdata.cli:cli

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=77.0.0
  run:
    - python >={{ python_min }}
    - click >=8.0.0
    - jinja2 >=3.0.0
    - lxml >=5.0.0
    - requests >=2.28.0
    - ruff >=0.9.8
    - toposort >=1.9
    - typing-extensions >=4.12.0

test:
  requires:
    - pytest
    - pytest-benchmark
    - python {{ python_min }}
  source_files:
    - tests/*
  commands:
    - pytest --benchmark-skip
    - xsdata --help


about:
  home: https://github.com/tefra/xsdata
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE
    - THIRD_PARTY_LICENSES.md
    - xsdata/schemas/LICENSE.W3C
  summary: Naive XML Bindings for python
  description: |
    xsData is a complete data binding library for python allowing developers
    to access and use XML and JSON documents as simple objects rather than
    using DOM.
  doc_url: https://xsdata.readthedocs.io
  dev_url: https://github.com/tefra/xsdata

extra:
  recipe-maintainers:
    - tefra
